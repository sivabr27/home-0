<!doctype html><html><head><meta charset="utf-8">
<style>
:root{--bg:#0B1726;--bg2:#112338;--ink:#F4F7FB;--mute:#9FB2C8;--warn:#FF8A3D;--bad:#FF4D5A;--ok:#2EC4B6;--gas:#B8E05A;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:Inter,sans-serif;color:var(--ink)}
#stage{position:absolute;inset:0;background:radial-gradient(1200px 700px at 70% 30%,#16314f 0%,var(--bg) 70%)}
.scene{position:absolute;inset:0;opacity:0}
.a{position:absolute;opacity:0;will-change:transform,opacity}
.h1{font-size:76px;font-weight:800;letter-spacing:-1.5px;line-height:1.08}
.h2{font-size:52px;font-weight:700;letter-spacing:-.8px;line-height:1.15}
.h3{font-size:36px;font-weight:600;line-height:1.25}
.p{font-size:28px;color:var(--mute);line-height:1.35}
.src{font-size:20px;color:#6F86A0}
.warn{color:var(--warn)} .ok{color:var(--ok)} .bad{color:var(--bad)}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:36px 40px;backdrop-filter:blur(4px)}
.pill{display:inline-block;padding:10px 22px;border-radius:999px;font-weight:700;font-size:24px;letter-spacing:1px;text-transform:uppercase}
.tick{width:64px;height:64px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;color:#0B1726}
.node{width:200px;text-align:center}
.dot{width:74px;height:74px;border-radius:50%;margin:0 auto 14px;border:4px solid #2a4562;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:var(--mute);transition:none}
.node .lab{font-size:22px;font-weight:600;color:var(--mute)}
#cue{position:absolute;left:160px;right:160px;bottom:40px;text-align:center;font-size:34px;font-weight:600;background:rgba(0,0,0,.72);padding:16px 26px;border-radius:16px;display:none;color:#fff}
#cue.on{display:block}
</style></head><body><div id="stage"></div><div id="cue"></div>
<script>
const W=1920,H=1080;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const easeIO=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
// ---------- people / icons ----------
function person(c='#F4F7FB',vest=null,s=1){return `<svg width="${80*s}" height="${170*s}" viewBox="0 0 80 170"><circle cx="40" cy="26" r="20" fill="${c}"/><path d="M12 70 Q12 52 40 52 Q68 52 68 70 L68 128 L54 128 L54 168 L26 168 L26 128 L12 128Z" fill="${vest||c}"/>${vest?'<rect x="12" y="88" width="56" height="7" fill="#F4F7FB" opacity=".85"/><rect x="12" y="104" width="56" height="7" fill="#F4F7FB" opacity=".85"/>':''}</svg>`}
function child(c){return person(c,null,.62)}
function worker(s=1){return `<svg width="${110*s}" height="${230*s}" viewBox="0 0 110 230"><path d="M24 40 Q55 0 86 40 Z" fill="#FFC23D"/><rect x="20" y="36" width="70" height="8" rx="4" fill="#FFC23D"/><circle cx="55" cy="58" r="22" fill="#C98B5E"/><path d="M14 104 Q14 82 55 82 Q96 82 96 104 L96 170 L14 170Z" fill="#FF8A3D"/><rect x="14" y="122" width="82" height="8" fill="#F4F7FB" opacity=".9"/><rect x="14" y="142" width="82" height="8" fill="#F4F7FB" opacity=".9"/><rect x="22" y="170" width="28" height="58" fill="#2B4A6B"/><rect x="60" y="170" width="28" height="58" fill="#2B4A6B"/></svg>`}
// ---------- scene definitions ----------
// Timeline matched to script paragraphs (seconds)
const T={p1:[0,10],p2:[10,26],p3:[26,45],p4:[45,56],p5:[56,87],p6:[87,99.5],p7:[99.5,110.5],p8:[110.5,123]};
const SCRIPT=[
 [0.5,10,["Sanitation workers in India still die inside sewers.","Not because we lack rules or technology.","Because nobody checks that the rules are followed."]],
 [10,26,["I have spent my PhD building gas sensors.","A methane or hydrogen sulphide sensor is not rocket science.","Students in Hyderabad have built one for 2,500 rupees.","But sensors like these mostly stay in labs."]],
 [26,45,["The rules are not missing either.","The law prescribes safety requirements for sewer work.","The Supreme Court has ordered the phased eradication of manual sewer cleaning and 30 lakh rupees compensation for every death.","A national scheme already provides training, protective gear and safety devices."]],
 [45,56,["The real gap is follow-through.","Was the job done by machine?","Was the air checked?","Was unsafe work stopped?","Today, nobody can easily prove it."]],
 [56,87,["My idea, Saans, is a safety platform that closes this gap.","Every job starts as a digital work order, with mechanised cleaning as the default.","In exceptional cases where entry is legally permitted, a rugged sensor checks the air.","If it is unsafe, work stops.","Every step is logged with time and location.","Contractors are judged on verified compliance with the full safety process, with independent audits to keep records honest."]],
 [87,99.5,["A manhole may look like a small place for impact.","But behind every worker is a family, and under every city the same gases build up silently."]],
 [99.5,110.5,["To scale this, we need a partner who can manufacture rugged sensors, run a city-level digital platform and deploy in the field with municipal authorities."]],
 [110.5,120,["India does not need another sensor that stays in a lab.","It needs a system that makes detection lead to action.","That is Saans."]]
];
const DUR=123;
const stage=document.getElementById('stage');
const scenes=[];const hooks=[];
function scene(key,html){const [s,e]=T[key];const d=document.createElement('div');d.className='scene';d.innerHTML=html;stage.appendChild(d);scenes.push({el:d,s,e});return {el:d,s,e};}
const A=(t,fx,css,html,extra='')=>`<div class="a" data-t="${t}" data-fx="${fx}" ${extra} style="${css}">${html}</div>`;

// ===== S1: manhole =====
let gasHTML='';for(let i=0;i<9;i++)gasHTML+=`<div class="gas" data-i="${i}" style="position:absolute;width:${110+i*12}px;height:${110+i*12}px;border-radius:50%;background:radial-gradient(circle,rgba(184,224,90,.55),rgba(184,224,90,0) 70%);"></div>`;
const s1=scene('p1',`
<svg style="position:absolute;left:0;top:0" width="1920" height="1080"><rect x="0" y="760" width="1920" height="320" fill="#1A2C42"/><rect x="0" y="752" width="1920" height="10" fill="#2a4562"/>
${[...Array(9)].map((_,i)=>`<rect x="${60+i*210}" y="900" width="110" height="10" rx="5" fill="#3a5878"/>`).join('')}
<g opacity=".5">${[[80,380,140],[240,300,220],[420,420,100],[1500,330,190],[1700,260,260]].map(([x,y,w])=>`<rect x="${x}" y="${y}" width="${w}" height="${760-y}" fill="#132840"/>`).join('')}</g></svg>
<div id="mhWrap" style="position:absolute;left:880px;top:560px;width:260px;height:240px;overflow:hidden"><div id="wk" style="position:absolute;left:75px;top:0">${worker(1)}</div></div>
<svg style="position:absolute;left:820px;top:770px" width="380" height="80"><ellipse cx="190" cy="34" rx="170" ry="30" fill="#05090F"/><ellipse cx="190" cy="34" rx="170" ry="30" fill="none" stroke="#4a6a8c" stroke-width="6"/></svg>
<svg id="lid" style="position:absolute;left:1190px;top:800px" width="260" height="60"><ellipse cx="130" cy="30" rx="120" ry="22" fill="#3c5a7a"/><ellipse cx="130" cy="30" rx="80" ry="12" fill="none" stroke="#5b7da0" stroke-width="4"/></svg>
<div id="gasBox" style="position:absolute;left:0;top:0;width:1920px;height:1080px">${gasHTML}</div>
${A(.6,'up','left:120px;top:120px;width:900px','<div class="h1">Sanitation workers still die inside India\'s sewers.</div>')}
${A(3.4,'scale','left:1240px;top:110px;width:560px','<div class="card" style="text-align:center"><div id="cnt" style="font-size:150px;font-weight:900;color:var(--warn);letter-spacing:-4px;line-height:1">0</div><div class="h3" style="margin-top:6px">sewer &amp; septic tank deaths</div><div class="p">Jan 2019 to Jun 2026</div><div class="src" style="margin-top:12px">Govt data cited in Parliament</div></div>')}
${A(5.2,'up','left:120px;top:420px','<div class="h2" style="color:var(--mute)">Not a lack of rules or technology.</div>')}
${A(7.4,'up','left:120px;top:500px','<div class="h2 warn">A lack of follow-through.</div>')}
`);
hooks.push((t)=>{const lt=t-s1.s;const wk=document.getElementById('wk');wk.style.top=(lerp(0,250,easeIO((lt-1.0)/3.2)))+'px';
 document.querySelectorAll('.gas').forEach(g=>{const i=+g.dataset.i;const ph=((lt*0.22+i/9)%1);const x=1010+Math.sin(lt*1.3+i)*40*ph - (110+i*12)/2;const y=800-ph*620;g.style.left=x+'px';g.style.top=y+'px';g.style.opacity=(Math.sin(ph*Math.PI)*clamp(lt-0.4)).toFixed(3)});
 const c=document.getElementById('cnt');c.textContent=Math.round(498*ease((lt-3.6)/1.8));});
function lerp(a,b,p){return a+(b-a)*p}

// ===== S2: lab sensor =====
const chip=`<svg width="520" height="520" viewBox="0 0 520 520"><g fill="#8aa2bd">${[...Array(6)].map((_,i)=>`<rect x="${110+i*60}" y="20" width="16" height="70" rx="4"/><rect x="${110+i*60}" y="430" width="16" height="70" rx="4"/><rect x="20" y="${110+i*60}" width="70" height="16" rx="4"/><rect x="430" y="${110+i*60}" width="70" height="16" rx="4"/>`).join('')}</g><rect x="80" y="80" width="360" height="360" rx="30" fill="#1d3550" stroke="#3b6189" stroke-width="6"/><rect x="140" y="140" width="240" height="240" rx="16" fill="#0f2236"/>${[...Array(7)].map((_,i)=>`<rect x="${160+(i%2)*20}" y="${158+i*30}" width="180" height="12" rx="6" fill="#E3B341"/>`).join('')}<rect x="150" y="150" width="220" height="220" rx="12" fill="#2EC4B6" opacity=".18"/></svg>`;
let mol='';for(let i=0;i<14;i++)mol+=`<div class="mol" data-i="${i}" style="position:absolute;width:26px;height:26px;border-radius:50%;background:${i%2?'var(--gas)':'#FF8A3D'};opacity:0"></div>`;
const s2=scene('p2',`
${A(.3,'scale','left:300px;top:250px',chip)}
<div id="molBox" style="position:absolute;inset:0">${mol}</div>
${A(.8,'right','left:1000px;top:150px','<div class="pill" style="background:rgba(46,196,182,.15);color:var(--ok)">My research</div><div class="h1" style="margin-top:18px">PhD in gas sensors</div>')}
${A(1.2,'left','left:120px;top:900px','<div style="border-left:8px solid var(--warn);padding:10px 24px;background:rgba(0,0,0,.35);border-radius:6px"><div class="h3">Siva</div><div class="p">PhD (Gas Sensors) | MBA, BITSoM</div></div>','data-out="7"')}
${A(4.2,'up','left:1000px;top:390px;width:820px','<svg width="760" height="160"><path id="sig" d="M0 140 L120 138 L200 134 L260 120 L300 60 L340 30 L420 26 L520 28 L620 27 L760 28" fill="none" stroke="var(--ok)" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg><div class="p">Methane and H<sub>2</sub>S detected in real time</div>')}
${A(7.6,'pop','left:1000px;top:640px','<div class="card" style="display:flex;align-items:center;gap:26px"><div style="font-size:84px;font-weight:900;color:var(--warn)">₹2,500</div><div><div class="h3">low-cost prototype</div><div class="p">built by students in Hyderabad</div></div></div>')}
<div id="jar" class="a" data-t="11" data-fx="drop" style="left:220px;top:150px"><svg width="680" height="700" viewBox="0 0 680 700"><path d="M60 690 L60 220 Q60 40 340 40 Q620 40 620 220 L620 690" fill="rgba(160,200,255,.08)" stroke="rgba(200,225,255,.55)" stroke-width="8"/><rect x="290" y="10" width="100" height="40" rx="14" fill="rgba(200,225,255,.55)"/><rect x="20" y="680" width="640" height="20" rx="8" fill="#3b6189"/></svg></div>
${A(12,'up','left:1000px;top:850px','<div class="h2 bad">...but it stays in the lab.</div>')}
`);
hooks.push((t)=>{const lt=t-s2.s;document.getElementById('sig').style.strokeDashoffset=1-ease((lt-4.5)/2.2);
 document.querySelectorAll('.mol').forEach(m=>{const i=+m.dataset.i;const ph=((lt*0.35+i/14)%1);const ang=i*0.9;const r=520*(1-ph);m.style.left=(560+Math.cos(ang)*r)+'px';m.style.top=(510+Math.sin(ang)*r*0.7)+'px';m.style.opacity=(clamp(lt-2)*clamp(1-(lt-10.5))*Math.sin(ph*Math.PI)*.9).toFixed(3)});});

// ===== S3: rules exist =====
const rule=(x,t,title,body,meta)=>A(t,'up',`left:${x}px;top:330px;width:520px`,`<div class="card" style="height:470px"><div class="tick a" data-t="${t+1}" data-fx="pop" style="position:relative">✓</div><div class="h2" style="margin-top:26px">${title}</div><div class="p" style="margin-top:16px">${body}</div><div class="src" style="margin-top:22px">${meta}</div></div>`);
const s3=scene('p3',`
${A(.4,'up','left:140px;top:110px','<div class="pill" style="background:rgba(46,196,182,.15);color:var(--ok)">The rules exist</div><div class="h1" style="margin-top:18px">Policy is not the problem.</div>')}
${rule(140,2.4,'The law','Manual Scavengers Act and Rules prescribe safety requirements for sewer work.','2013')}
${rule(700,6,'Supreme Court','Phased eradication of manual sewer cleaning. <span class="warn" style="font-weight:700">₹30 lakh</span> compensation per death.','Balram Singh v. Union of India, 2023')}
${rule(1260,12.5,'NAMASTE scheme','Training, protective gear and safety devices. <span class="ok" style="font-weight:700">90,186</span> workers validated.','Ministry of Social Justice, Sept 2026')}
`);

// ===== S4: follow-through gap =====
const q=(y,t,txt)=>A(t,'left',`left:220px;top:${y}px;width:1480px`,`<div style="display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid rgba(255,255,255,.1);padding:22px 0"><div class="h2">${txt}</div><div class="a" data-t="${t+.8}" data-fx="stamp" style="position:relative"><span class="pill" style="background:rgba(255,77,90,.15);color:var(--bad);border:3px solid var(--bad);font-size:30px">No proof</span></div></div>`);
const s4=scene('p4',`
${A(.3,'up','left:220px;top:110px','<div class="h1">The real gap is <span class="warn">follow-through.</span></div>')}
${q(300,1.6,'Was the job done by machine?')}
${q(450,3.6,'Was the air checked?')}
${q(600,5.4,'Was unsafe work stopped?')}
${A(7.8,'scale','left:220px;top:830px','<div class="h2" style="color:var(--mute)">Today, nobody can easily prove it.</div>')}
`);

// ===== S5: SAANS platform =====
const steps=['Work order','Machine first','Air check','Stop unsafe work','Verified record'];
const pipe=`<div style="position:absolute;left:180px;top:850px;width:1560px;height:4px;background:#2a4562"></div><div id="pipeFill" style="position:absolute;left:180px;top:850px;height:4px;width:0;background:var(--ok)"></div>`+steps.map((s,i)=>`<div class="node" style="position:absolute;left:${80+i*390}px;top:810px"><div class="dot" id="nd${i}">${i+1}</div><div class="lab" id="nl${i}">${s}</div></div>`).join('');
const stage5=(t0,t1,html)=>`<div class="st5" data-a="${t0}" data-b="${t1}" style="position:absolute;left:0;top:0;width:1920px;height:780px;opacity:0">${html}</div>`;
const gauge=(name,id,x)=>`<div style="position:absolute;left:${x}px;top:250px;width:260px;text-align:center"><div style="height:380px;width:90px;margin:0 auto;border-radius:45px;background:#132840;border:3px solid #2a4562;position:relative;overflow:hidden"><div id="${id}" style="position:absolute;bottom:0;left:0;right:0;height:20%;background:var(--ok)"></div></div><div class="h3" style="margin-top:16px">${name}</div><div class="p" id="${id}v">safe</div></div>`;
const s5=scene('p5',`
<div id="logoBox" style="position:absolute;left:0;top:0;width:1920px;height:780px">
${A(.2,'scale','left:560px;top:240px;width:800px;text-align:center','<svg width="600" height="90" viewBox="0 0 600 90"><path id="breath" d="M0 45 C60 45 70 10 120 10 C170 10 180 80 230 80 C280 80 290 10 340 10 C390 10 400 80 450 80 C500 80 510 45 600 45" fill="none" stroke="var(--ok)" stroke-width="7" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg><div style="font-size:150px;font-weight:900;letter-spacing:18px;margin-top:6px">SAANS</div><div class="h3" style="color:var(--mute)">A safety platform, not just a sensor</div>','data-out="4.2"')}
</div>
${stage5(4.4,9.6,`<div style="position:absolute;left:330px;top:110px;width:330px;height:620px;border-radius:46px;background:#0f1f33;border:6px solid #3b6189;padding:60px 26px"><div class="p" style="font-size:22px">SAANS</div><div class="h3" style="margin:10px 0 18px">New work order</div><div class="card" style="padding:20px;border-radius:18px"><div class="p" style="font-size:22px">Job #4521 · Ward 12</div><div style="margin-top:10px" class="pill ok">Mechanised</div><div class="p" style="font-size:20px;margin-top:10px">default method</div></div></div><div style="position:absolute;left:800px;top:260px;width:900px"><div class="h1">Every job starts as a digital work order.</div></div>`)}
${stage5(9.6,14,`<svg style="position:absolute;left:220px;top:250px" width="620" height="340" viewBox="0 0 620 340"><rect x="20" y="120" width="380" height="150" rx="20" fill="#2EC4B6"/><rect x="400" y="160" width="170" height="110" rx="18" fill="#26a99c"/><rect x="430" y="180" width="100" height="50" rx="8" fill="#0f1f33"/><circle cx="110" cy="285" r="42" fill="#0f1f33" stroke="#8aa2bd" stroke-width="10"/><circle cx="470" cy="285" r="42" fill="#0f1f33" stroke="#8aa2bd" stroke-width="10"/><rect x="80" y="60" width="200" height="60" rx="14" fill="#1b8f85"/><path d="M60 120 L40 30 L10 30" stroke="#8aa2bd" stroke-width="12" fill="none" stroke-linecap="round"/></svg><div style="position:absolute;left:960px;top:240px;width:820px"><div class="h1">Mechanised cleaning by default.</div><div class="h3" style="color:var(--mute);margin-top:24px">Human entry only as an approved, legal exception.</div></div>`)}
${stage5(14,18.6,`${gauge('CH₄','g1',260)}${gauge('H₂S','g2',540)}${gauge('O₂','g3',820)}<div style="position:absolute;left:1180px;top:270px;width:640px"><div class="h1">A rugged sensor checks the air.</div><div class="h3" style="color:var(--mute);margin-top:24px">Built for humid sewers, where cheap sensors drift.</div></div>`)}
${stage5(18.6,23.4,`<div id="alarm" style="position:absolute;left:250px;top:200px;width:620px;height:420px;border-radius:40px;background:var(--bad);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 120px rgba(255,77,90,.6)"><div style="font-size:120px;font-weight:900;letter-spacing:4px">STOP</div><div class="h2">WORK</div></div><div style="position:absolute;left:1000px;top:220px;width:820px"><div class="h1" style="margin-bottom:30px">Unsafe air? Work stops.</div>${['Ventilation','Protective equipment','Full safety checklist'].map((x,i)=>`<div class="a" data-t="${19.8+i*.9}" data-fx="left" style="position:relative;display:flex;align-items:center;gap:20px;margin:16px 0"><div class="tick" style="width:52px;height:52px;font-size:32px">✓</div><div class="h3">${x}</div></div>`).join('')}</div>`)}
${stage5(23.4,31,`<div class="card" style="position:absolute;left:220px;top:150px;width:700px"><div style="display:flex;justify-content:space-between;align-items:center"><div class="h3">Safety record</div><span class="pill" style="background:rgba(46,196,182,.15);color:var(--ok)">✓ Verified</span></div><div class="p" style="margin-top:22px">Job #4521 · Ward 12</div><div class="p">Time logged · 11:42 AM</div><div class="p">Location logged · GPS</div><div class="p">Readings · Checklist · Approvals</div></div><div style="position:absolute;left:1040px;top:170px;width:780px"><div class="h1">Every step logged.</div><div class="a" data-t="26.6" data-fx="up" style="position:relative;margin-top:34px"><div class="h2 ok">Contractors judged on verified compliance.</div></div><div class="a" data-t="28.8" data-fx="up" style="position:relative;margin-top:24px"><div class="h3" style="color:var(--mute)">Independent audits keep records honest.</div></div></div>`)}
${A(4.2,'up','left:0;top:0;width:1920px;height:1080px',pipe)}
`);
hooks.push((t)=>{const lt=t-s5.s;
 document.getElementById('breath').style.strokeDashoffset=1-ease((lt-.3)/2);
 document.querySelectorAll('.st5').forEach(e=>{const a=+e.dataset.a,b=+e.dataset.b;const o=clamp((lt-a)/.45)*clamp((b-lt)/.45);e.style.opacity=o;e.style.transform=`translateY(${(1-ease((lt-a)/.6))*30}px)`});
 const bounds=[4.4,9.6,14,18.6,23.4];let cur=-1;bounds.forEach((b,i)=>{if(lt>=b)cur=i});
 for(let i=0;i<5;i++){const d=document.getElementById('nd'+i),l=document.getElementById('nl'+i);const on=i<=cur;d.style.borderColor=on?(i==3?'var(--bad)':'var(--ok)'):'#2a4562';d.style.color=on?'#0B1726':'var(--mute)';d.style.background=on?(i==3?'var(--bad)':'var(--ok)'):'var(--bg2)';d.style.transform=`scale(${i==cur?1.15:1})`;l.style.color=i==cur?'var(--ink)':'var(--mute)'}
 document.getElementById('pipeFill').style.width=(1560*clamp((lt-4.4)/(23.4-4.4+1)))+'px';
 const g=(id,p,bad)=>{const e=document.getElementById(id);e.style.height=(20+70*p)+'%';e.style.background=bad&&p>.6?'var(--bad)':(p>.4?'var(--warn)':'var(--ok)');document.getElementById(id+'v').textContent=bad&&p>.6?'UNSAFE':(p>.4?'rising':'safe');document.getElementById(id+'v').style.color=bad&&p>.6?'var(--bad)':'var(--mute)'};
 g('g1',.35*ease((lt-14.6)/2),false);g('g2',ease((lt-15)/2.6),true);g('g3',.15,false);
 const al=document.getElementById('alarm');al.style.transform=`scale(${1+.04*Math.sin(lt*10)})`;});

// ===== S6: ripple =====
const fam=`<div style="display:flex;align-items:flex-end;gap:10px">${person('#F4C27A')}${person('#9FB2C8')}${child('#FF8A3D')}${child('#2EC4B6')}</div>`;

const s6=scene('p6',`
<div id="rings" style="position:absolute;left:0;top:0;width:1920px;height:1080px">${[0,1,2].map(i=>`<div class="ring" data-i="${i}" style="position:absolute;left:660px;top:560px;border-radius:50%;border:3px solid rgba(46,196,182,.45)"></div>`).join('')}</div>

${A(3.2,'up','left:120px;top:560px',fam)}
${A(5.6,'up','left:1080px;top:520px',city)}
${A(.4,'up','left:120px;top:100px;width:1700px','<div class="h1">A manhole looks like a small place for impact.</div>')}
${A(3.4,'up','left:120px;top:210px;width:1700px','<div class="h2" style="color:var(--mute)">Behind every worker is a <span class="warn">family</span>. Under every city, the same <span style="color:var(--gas)">gases</span> build up silently.</div>')}
${A(8.6,'up','left:1080px;top:800px;width:700px','<div class="p">Every Saans reading also maps where a city\'s sewers are at risk.</div>')}
<div id="hot" style="position:absolute;left:1080px;top:520px;width:560px;height:220px">${[[90,170],[300,190],[470,160]].map(([x,y],i)=>`<div class="hs" data-i="${i}" style="position:absolute;left:${x}px;top:${y}px;width:40px;height:40px;margin:-20px;border-radius:50%;background:rgba(184,224,90,.8);opacity:0"></div>`).join('')}</div>
`);
hooks.push((t)=>{const lt=t-s6.s;document.querySelectorAll('.ring').forEach(r=>{const i=+r.dataset.i;const ph=((lt*.35+i/3)%1);const R=100+ph*900;r.style.width=R+'px';r.style.height=R+'px';r.style.marginLeft=(-R/2)+'px';r.style.marginTop=(-R/2)+'px';r.style.opacity=(clamp(lt-.5)*(1-ph)).toFixed(3)});
 document.querySelectorAll('.hs').forEach(h=>{const i=+h.dataset.i;const p=.6+.4*Math.sin(lt*4+i);h.style.opacity=(clamp((lt-7.6-i*.3)/.5)*p).toFixed(3);h.style.transform=`scale(${.8+.5*p})`});});

const box=(x,y,t,title,sub)=>A(t,'pop',`left:${x}px;top:${y}px;width:470px`,`<div class="card" style="text-align:center;background:#15283f"><div class="h3">${title}</div><div class="p" style="margin-top:8px">${sub}</div></div>`);

// ---------- render ----------
function applyFx(el,p,fx){const e=ease(p);let tr='';
 if(fx==='up')tr=`translateY(${(1-e)*50}px)`;else if(fx==='left')tr=`translateX(${(1-e)*-80}px)`;else if(fx==='right')tr=`translateX(${(1-e)*80}px)`;
 else if(fx==='scale')tr=`scale(${.85+.15*e})`;else if(fx==='pop'){const b=p<1?1+.12*Math.sin(clamp(p)*Math.PI):1;tr=`scale(${(.6+.4*e)*b})`}
 else if(fx==='stamp')tr=`scale(${1.8-.8*e}) rotate(${-8*e}deg)`;else if(fx==='drop')tr=`translateY(${(1-easeIO(p))*-900}px)`;
 el.style.opacity=fx==='drop'?(p>0?1:0):e;el.style.transform=tr;}
window.render=function(t,cue){
 for(const sc of scenes){const o=clamp((t-sc.s)/.5)*clamp((sc.e-t)/.5);sc.el.style.opacity=o;sc.el.style.display=o>0?'block':'none';
  if(o<=0)continue;const lt=t-sc.s;
  sc.el.querySelectorAll('.a').forEach(el=>{const st=+el.dataset.t;let p=(lt-st)/(+el.dataset.d||.7);applyFx(el,clamp(p),el.dataset.fx);if(el.dataset.out){const q=clamp((lt-+el.dataset.out)/.5);el.style.opacity=(+el.style.opacity)*(1-q)}});}
 hooks.forEach((h,i)=>{const sc=scenes[[0,1,4,5,6][i]];if(sc&&t>=sc.s-.1&&t<=sc.e+.1)h(t)});
 const c=document.getElementById('cue');if(cue){let txt='';for(const [a,b,ss] of SCRIPT){if(t>=a&&t<b){const words=ss.map(s=>s.split(' ').length);const tot=words.reduce((x,y)=>x+y);let acc=a;for(let k=0;k<ss.length;k++){const d=(b-a)*words[k]/tot;if(t<acc+d){txt=ss[k];break}acc+=d}}}c.textContent=txt;c.className=txt?'on':''}else c.className='';
};
window.DUR=DUR;render(0);
</script></body></html>
