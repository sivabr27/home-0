<!doctype html><html><head><meta charset="utf-8">
<style>
:root{--ch:#1B1C1E;--ch2:#26282B;--wh:#F6F3EC;--red:#D9333F;--teal:#17A89B;--yel:#FFE14D;--mute:#A8A39A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#111;font-family:Helvetica,"Liberation Sans",Arial,sans-serif;color:var(--wh)}

.ui{position:absolute;left:0;top:0;transform-origin:0 0;background:#0F1416;color:#EDEDED;overflow:hidden;font-family:Helvetica,"Liberation Sans",Arial;filter:blur(.4px) brightness(.93)}

</style></head><body><div id="root"></div><div id="paper"></div><div id="vig"></div><div id="grain"></div><div id="note">Illustrative imagery · Saans screens are proposed interfaces</div><div id="sub"></div>
<script>
const C=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));const E=x=>{x=C(x);return 1-Math.pow(1-x,3)};const EIO=x=>{x=C(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};const L=(a,b,p)=>a+(b-a)*p;
const $=id=>document.getElementById(id);const root=$('root');const shots=[];
const SX=x=>x*1.25, SY=y=>y*1.25-100; // source(1536x1024) -> frame
function shot(s,e,html,hook,tr='cut'){const d=document.createElement('div');d.className='shot';d.innerHTML=html;root.appendChild(d);d.querySelectorAll('[data-t]').forEach(x=>x.dataset.t=+x.dataset.t+s);d.querySelectorAll('[data-hl]').forEach(x=>x.dataset.hl=+x.dataset.hl+s);shots.push({el:d,s,e,hook,tr});return d;}
const A=(t,fx,css,h)=>`<div class="a" data-t="${t}" data-fx="${fx}" style="${css}">${h}</div>`;
const PW=(id,img,inner='')=>`<div class="pw" id="${id}"><img src="img2/${img}.jpg">${inner}</div>`;
function cam(el,s,x,y){el.style.transformOrigin=`${x}px ${y}px`;el.style.transform=`scale(${s})`;}
// homography: map w x h rect to quad (frame coords)
function m3d(w,h,q){const [x0,y0,x1,y1,x2,y2,x3,y3]=q;function adj(m){return[m[4]*m[8]-m[5]*m[7],m[2]*m[7]-m[1]*m[8],m[1]*m[5]-m[2]*m[4],m[5]*m[6]-m[3]*m[8],m[0]*m[8]-m[2]*m[6],m[2]*m[3]-m[0]*m[5],m[3]*m[7]-m[4]*m[6],m[1]*m[6]-m[0]*m[7],m[0]*m[4]-m[1]*m[3]]}
 function mul(a,b){const c=[];for(let i=0;i<3;i++)for(let j=0;j<3;j++){let s=0;for(let k=0;k<3;k++)s+=a[3*i+k]*b[3*k+j];c[3*i+j]=s}return c}
 function mv(m,v){return[m[0]*v[0]+m[1]*v[1]+m[2]*v[2],m[3]*v[0]+m[4]*v[1]+m[5]*v[2],m[6]*v[0]+m[7]*v[1]+m[8]*v[2]]}
 function basis(a,b,c,d,e,f,g,h){const m=[a,c,e,b,d,f,1,1,1];const v=mv(adj(m),[g,h,1]);return mul(m,[v[0],0,0,0,v[1],0,0,0,v[2]])}
 const s=basis(0,0,w,0,0,h,w,h),d=basis(x0,y0,x1,y1,x3,y3,x2,y2);const t=mul(d,adj(s));for(let i=0;i<9;i++)t[i]/=t[8];
 return `matrix3d(${t[0]},${t[3]},0,${t[6]},${t[1]},${t[4]},0,${t[7]},0,0,1,0,${t[2]},${t[5]},0,${t[8]})`;}
const Q=(pts)=>pts.map((v,i)=>i%2?SY(v):SX(v));
const SCR6=Q([400,252,570,274,546,668,352,658]), SCR7=Q([796,334,925,346,889,637,744,620]), SCR9=Q([742,478,1088,484,1053,720,708,670]);
const UI=(id,w,h,q,html)=>`<div class="ui" id="${id}" style="width:${w}px;height:${h}px;transform:${m3d(w,h,q)}">${html}</div>`;
const RC=(cx,cy,rx,ry,t)=>{let d='';for(let i=0;i<=44;i++){const a=-0.4+i/40*Math.PI*2.15;const j=1+.04*Math.sin(i*1.7);d+=(i?'L':'M')+(cx+Math.cos(a)*rx*j).toFixed(1)+' '+(cy+Math.sin(a)*ry*j).toFixed(1)+' '}return `<path class="rc rcp" data-hl="${t}" d="${d}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>`};
const DOC=(id,img,w,sw,x,y,hls,cap='',circ=[])=>{const k=w/sw;return `<div class="doc" id="${id}" style="left:${x}px;top:${y}px;width:${w}px"><div class="pg"><img src="img2/${img}.jpg" style="width:${w}px;display:block">${hls.map(([t,a,b,c,d])=>`<div class="hb" data-hl="${t}" style="left:${a*k}px;top:${b*k}px;width:${c*k}px;height:${d*k}px"></div>`).join('')}</div><svg style="position:absolute;left:0;top:0;overflow:visible" width="${w}" height="10">${circ.map(([t,cx,cy,rx,ry])=>RC(cx*k,cy*k,rx*k,ry*k,t)).join('')}</svg>${cap}</div>`};
const SAANSHEAD=`<div style="display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:3px;font-size:15px"><span style="width:12px;height:12px;border-radius:50%;background:var(--teal)"></span>SAANS</div>`;

/* ================= SCENE 1 (0-12) ================= */
shot(0,3.2,PW('s1a','../img/h1')+A(.4,'up','left:90px;top:80px','<span class="brut">India, 2026.</span>'),(t,lt)=>cam($('s1a'),1.04+lt*.05,1062,620));
shot(3.0,5.6,PW('s1b','a1'),(t,lt)=>cam($('s1b'),1.03+lt*.035,880,700));
shot(5.4,9.8,PW('s1c','a2')+`<div id="dk1" style="position:absolute;inset:0;background:#000;opacity:0"></div>
<div id="big1" style="position:absolute;left:0;top:250px;width:1920px;text-align:center;opacity:0"><div style="font-size:290px;font-weight:700;letter-spacing:-10px;line-height:1" id="n498">0</div><div style="font-size:40px;font-weight:700;margin-top:10px">Reported sewer and septic-tank cleaning deaths</div><div style="font-size:24px;color:#ddd;margin-top:10px">1 January 2019 to 30 June 2026 · Government data placed before the Lok Sabha, reported by NDTV</div><div style="margin-top:22px"><span class="brut y" style="font-size:40px">≈ one death every 5.5 days</span></div></div>
<div id="evc" class="ev" style="position:absolute;left:60px;top:60px;width:420px;opacity:0"><div class="kick" style="color:var(--red)">Evidence</div><div style="font-size:60px;font-weight:700;line-height:1;margin-top:4px">498</div><div style="font-size:19px;margin-top:6px">reported sewer &amp; septic-tank deaths, Jan 2019 to Jun 2026</div><div class="src" style="margin-top:4px">Lok Sabha data via NDTV, 5 Aug 2026</div></div>`,(t,lt)=>{
 const mv=lt<.4?lt:(lt<3.2?.4:.4+(lt-3.2)*2.2);cam($('s1c'),1.03+mv*.06,1000,462);
 $('dk1').style.opacity=.6*C((lt-.4)/.15)*(1-C((lt-3)/.4));const b=$('big1');b.style.opacity=C((lt-.5)/.25)*(1-C((lt-2.8)/.3));$('n498').textContent=Math.round(498*E((lt-.5)/1.2));
 const p=E((lt-2.9)/.5);const ev=$('evc');ev.style.opacity=p;ev.style.transform=`translate(${(1-p)*720}px,${(1-p)*260}px) scale(${1.6-.6*p})`;});
shot(9.6,12.2,`<div class="tex"></div>${DOC('nd','shotC_ndtv',1060,1060,430,330,[[0.9,728,224,232,34],[1.4,598,268,384,34],[1.4,20,311,74,34]],'',[[1.3,844,241,150,40]])}${A(.3,'up','left:430px;top:230px','<div class="kick" style="color:var(--mute)">NDTV · 5 August 2026</div>')}`,(t,lt)=>{const d=$('nd');const p=E(lt/.5);d.style.transform=`translate(${(1-p)*300}px,0) scale(${1+lt*.03})`;d.style.opacity=p;},'cut');

/* ================= SCENE 2 (12-27) ================= */
shot(12,13.5,`<div class="pw" id="s2p"><img src="img2/phd_cleanroom.jpg" style="top:0;height:1081px"></div>`+A(.2,'left','left:90px;top:80px','<div class="ev" style="border-left-color:var(--teal)"><div class="kick" style="color:var(--teal)">My PhD · real photo</div><div style="font-size:40px;font-weight:700;margin-top:4px">Semiconductor cleanroom, gas-sensor research</div></div>'),(t,lt)=>cam($('s2p'),1.03+lt*.03,960,500),'push');
shot(13.3,14.8,`<div class="pw" id="s2q"><img src="img2/phd_talk.jpg" style="top:-180px;height:1440px"><div class="hb" data-hl=".3" style="left:${600*1.5}px;top:${372*1.5-180}px;width:${420*1.5}px;height:${30*1.5}px"></div><div class="hb" data-hl=".6" style="left:${620*1.5}px;top:${452*1.5-180}px;width:${385*1.5}px;height:${28*1.5}px"></div></div>`+A(.2,'left','left:90px;top:80px','<div class="ev" style="border-left-color:var(--teal)"><div class="kick" style="color:var(--teal)">My PhD · real photo</div><div style="font-size:36px;font-weight:700;margin-top:4px">III-nitride (GaN) gas sensors</div></div>'),(t,lt)=>cam($('s2q'),1.25+lt*.04,1200,560),'cut');
shot(99999,99999,PW('s2a','a5',`<svg style="position:absolute;left:0;top:0" width="1920" height="1080"><rect id="r2a" x="${SX(895)}" y="${SY(520)}" width="${1.25*340}" height="${1.25*280}" fill="none" stroke="#fff" stroke-width="4" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>`)+A(.3,'left','left:90px;top:80px','<div class="ev" style="border-left-color:var(--teal)"><div class="kick" style="color:var(--teal)">My PhD</div><div style="font-size:40px;font-weight:700;margin-top:4px">Building gas sensors</div></div>')+A(1,'up',`left:${SX(900)}px;top:${SY(470)}px`,'<div class="co">Gas test chamber · sensor array</div>'),(t,lt)=>{cam($('s2a'),1.03+lt*.03,SX(1060),SY(680));$('r2a').style.strokeDashoffset=1-E((lt-.5)/.6);},'push');
shot(14.6,17.4,PW('s2b','a3',`<svg style="position:absolute;left:0;top:0" width="1920" height="1080"><rect id="r2b" x="${SX(585)}" y="${SY(318)}" width="${1.25*255}" height="${1.25*262}" rx="10" fill="none" stroke="#fff" stroke-width="4" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>`)+A(.7,'left',`left:${SX(860)}px;top:${SY(360)}px`,'<div class="co">CH₄ · flammable gas (% LEL)</div>')+A(1,'left',`left:${SX(860)}px;top:${SY(430)}px`,'<div class="co">O₂ · oxygen (%)</div>')+A(1.3,'left',`left:${SX(860)}px;top:${SY(500)}px`,'<div class="co">H₂S · toxic gas (ppm)</div>'),(t,lt)=>{cam($('s2b'),1.05+lt*.04,SX(710),SY(450));$('r2b').style.strokeDashoffset=1-E((lt-.2)/.5);},'cut');
// sensor head -> circular match cut into cutaway
shot(17.2,18.6,PW('s2c','a13'),(t,lt)=>{cam($('s2c'),1.05+Math.pow(E(lt/1.4),2)*5,SX(643),SY(470));},'cut');
let gp='';for(let i=0;i<46;i++)gp+=`<circle class="gp" data-i="${i}" r="${5+(i%3)*2}" fill="${i%3==0?'#E0343F':(i%3==1?'#F2A33A':'#A4D65E')}" opacity=".9"/>`;
shot(18.4,21,PW('s2d','a4',`<svg style="position:absolute;left:0;top:0" width="1920" height="1080">${gp}</svg>`)+A(.5,'up','left:90px;top:80px','<div class="ev" style="border-left-color:var(--red)"><div class="kick" style="color:var(--mute)">Explainer cutaway</div><div style="font-size:36px;font-weight:700;margin-top:4px">Gases you cannot see or reliably smell</div><div class="src" style="margin-top:6px">H₂S, methane, low oxygen · illustrative particles</div></div>'),(t,lt)=>{
 cam($('s2d'),1.12-lt*.04,SX(820),SY(700));const sh=shots.find(s=>s.s==18.4).el;sh.style.clipPath=lt<.6?`circle(${L(70,1300,EIO(lt/.6))}px at ${SX(820)}px ${SY(720)}px)`:'none';
 document.querySelectorAll('.gp').forEach(c=>{const i=+c.dataset.i;let x,y;if(i<34){x=((i*113+lt*120*(1+(i%4)*.3))%1900)+10;y=SY(720)+((i*41)%110)+Math.sin(lt*2+i)*8}else{const ph=((lt*.35+(i-34)/12)%1);x=SX(760)+((i*37)%120)+Math.sin(lt*3+i)*10;y=SY(690)-ph*360}c.setAttribute('cx',x);c.setAttribute('cy',y);});},'cut');
shot(20.8,23.6,`<div class="tex"></div>${DOC('etv','shotD_etv',1000,1224,460,150,[[.7,480,44,648,40],[1.1,9,88,268,40]])}${A(.3,'up','left:90px;top:80px','<span class="brut y">The tech exists.</span>')}${A(1.4,'pop','left:1300px;top:620px','<div class="ev" style="border-left-color:var(--yel);width:430px"><div style="font-size:56px;font-weight:700;color:var(--yel)">₹2,500</div><div style="font-size:21px;margin-top:4px">production cost of the student prototype</div><div class="src" style="margin-top:4px">ETV Bharat, 24 Feb 2025</div></div>')}`,(t,lt)=>{const d=$('etv');const p=E(lt/.5);d.style.transform=`translate(0,${(1-p)*200}px) scale(${1+lt*.025})`;d.style.opacity=p;},'cut');
shot(23.4,27.2,`<div class="tex"></div>
<div id="lt" style="position:absolute;left:120px;top:220px;width:760px"><div style="height:500px;background:url(img2/a13.jpg) 40% 50%/cover;border:6px solid #fff"></div><div class="kick" style="margin-top:14px;color:var(--teal)">In the lab: the sensor works</div></div>
<div id="rt" style="position:absolute;left:1040px;top:220px;width:760px"><div style="height:500px;background:url(img2/a2.jpg) center/cover;border:6px solid #fff"></div><div class="kick" style="margin-top:14px;color:var(--red)">At the manhole: no sensor, no record</div></div>

${A(1.4,'pop','left:905px;top:420px','<div style="width:100px;height:100px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:62px;font-weight:700">✕</div>')}`,(t,lt)=>{const s=EIO(lt/1.1);$('lt').style.transform=`translateX(${(1-s)*400}px)`;$('rt').style.transform=`translateX(${-(1-s)*400}px)`;$('br2').style.opacity=C((lt-1)/.3);},'cut');

shot(27,30.8,PW('s3a','a8')+A(.5,'left','left:90px;top:90px','<div class="ev" style="border-left-color:var(--yel);width:620px"><div class="kick" style="color:var(--yel)">Law</div><div style="font-size:30px;font-weight:700;margin-top:6px">Manual Scavengers Act, 2013 and Rules</div><div style="font-size:22px;margin-top:6px">prescribe protective gear and safety devices for sewer work</div></div>'),(t,lt)=>cam($('s3a'),1.03+lt*.02,SX(760),SY(600)),'push');

const SUB=[[0.3,12,"Sanitation workers in India still die inside sewers. Not because we lack rules or technology. Because nobody checks that the rules are followed."],[12,27,"I have spent my PhD building gas sensors. A methane or hydrogen sulphide sensor is not rocket science. Students in Hyderabad have built one for 2,500 rupees. But sensors like these mostly stay in labs."],[27,43,"The rules are not missing either. The law prescribes safety requirements for sewer work. The Supreme Court has ordered the phased eradication of manual sewer cleaning and 30 lakh rupees compensation for every death. A national scheme already provides training, protective gear and safety devices."],[43,56,"The real gap is follow-through. Was the job done by machine? Was the air checked? Was unsafe work stopped? Today, nobody can easily prove it."],[56,62,"My idea, Saans, is a safety platform that closes this gap."],[62,68,"Every job starts as a digital work order, with mechanised cleaning as the default."],[68,75,"In exceptional cases where entry is legally permitted, a rugged sensor checks the air. If it is unsafe, work stops."],[75,87,"Every step is logged with time and location. Contractors are judged on verified compliance with the full safety process, with independent audits to keep records honest."],[87,102,"A manhole may look like a small place for impact. But behind every worker is a family, and under every city the same gases build up silently."],[102,112,"To scale this, we need a partner who can manufacture rugged sensors, run a city-level digital platform and deploy in the field with municipal authorities."],[112,119.5,"India does not need another sensor that stays in a lab. It needs a system that makes detection lead to action. That is Saans."]];
